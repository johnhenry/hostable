name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          path: hostable

      # servable isn't published yet -- see the identical comment in
      # ci.yml. Drop this (and --install-links below) once it is.
      - uses: actions/checkout@v4
        with:
          repository: johnhenry/servable
          path: servable

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # servable's dist/ is gitignored -- see the identical comment in
      # ci.yml.
      - run: npm install --omit=dev
        working-directory: servable
      - run: npm run build
        working-directory: servable

      - run: npm ci --install-links
        working-directory: hostable

      - run: npm test
        working-directory: hostable

      - name: Publish
        # Idempotent: `npm view` exits non-zero for a version that isn't on
        # the registry yet, which is the signal to publish.
        working-directory: hostable
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already published::$PKG_NAME@$PKG_VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
